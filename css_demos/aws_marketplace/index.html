<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/333a9a021c.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <title>AWS Marketplace: Homepage</title>
  </head>
  <body>
    <header>
      <div class="top-header">
        <div class="logo">
          <img src="logo.png" alt="aws logo" height="30px" /><span
            class="logo-text"
            >marketplace</span
          >
        </div>

        <div class="search">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input
            type="search"
            placeholder="Describe the solution you're looking for..."
          />
          <i class="fa-solid fa-magnifying-glass search-icon-submit"></i>
        </div>

        <div class="top-header-left">
          <a href="#">Agent Mode</a>
          <p>English <i class="fa-solid fa-sort-down"></i></p>
          <p>
            <span>Hello,</span>
            <span>KipCollo <i class="fa-solid fa-sort-down"></i></span>
          </p>
        </div>
      </div>
      <div class="bottom-header">
        <div class="link">
          <a href="#">About <i class="fa-solid fa-sort-down"></i></a
          ><a href="#">Categories <i class="fa-solid fa-sort-down"></i></a
          ><a href="#">Delivery Methods <i class="fa-solid fa-sort-down"></i></a
          ><a href="#">Solutions<i class="fa-solid fa-sort-down"></i></a
          ><a href="#">Resources <i class="fa-solid fa-sort-down"></i></a>
        </div>
        <div class="link">
          <a href="#">Become a Channel Partner</a
          ><a href="#">Sell in AWS Marketplace</a
          ><a href="#">Amazon Web Services home</a><a href="#">Help</a>
        </div>
      </div>
    </header>
  </body>
</html>
